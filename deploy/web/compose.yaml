name: genoffice-web

services:
  web:
    image: ${GENOFFICE_WEB_IMAGE:-genoffice-web:0.1.0}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    ports:
      - '${GENOFFICE_WEB_BIND_ADDRESS:-0.0.0.0}:${GENOFFICE_WEB_PORT:-8080}:80'
    environment:
      XLSX_ENGINE_SERVERS: ${XLSX_ENGINE_SERVERS:?set XLSX_ENGINE_SERVERS in deploy/web/.env}
      XLSX_ENGINE_STICKY_COOKIE_SECURE: ${XLSX_ENGINE_STICKY_COOKIE_SECURE:-false}
    restart: unless-stopped
    stop_grace_period: 15s
