name: Temporary Web Host Format

on:
  push:
    branches: [agent/web-office-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/web-office-foundation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write examples/web-host/src/style.css
      - name: Commit formatted stylesheet
        run: |
          if git diff --quiet -- examples/web-host/src/style.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/web-host/src/style.css
          git commit -m "style(web): apply repository Prettier"
          git push origin HEAD:agent/web-office-foundation
