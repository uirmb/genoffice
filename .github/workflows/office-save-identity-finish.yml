name: Office Save Identity Finish

on:
  push:
    branches: [agent/office-file-protocol-save-finish]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/office-file-protocol-alignment
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Make save intent and identity explicit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Docs sends save/saveAs intent itself and rejects success without authoritative Host identity.
          replace_once(
              'apps/docs/src/web/desktop-api.ts',
              """  const saveWithName = async (\n    name: string,\n    data: ArrayBuffer,\n  ): Promise<{ ok: boolean; path?: string; error?: string; reason?: 'external-modified' }> => {\n""",
              """  const saveWithName = async (\n    name: string,\n    data: ArrayBuffer,\n    saveMode: 'save' | 'saveAs' = 'save',\n  ): Promise<{ ok: boolean; path?: string; error?: string; reason?: 'external-modified' }> => {\n""",
          )
          replace_once(
              'apps/docs/src/web/desktop-api.ts',
              """      const result = await host.saveDocument({\n        file,\n        bytes: data,\n        baseVersion: current?.file.version ?? null,\n        newDocument,\n      })\n""",
              """      const result = await host.saveDocument({\n        file,\n        bytes: data,\n        baseVersion: current?.file.version ?? null,\n        mode: saveMode,\n        newDocument,\n      })\n""",
          )
          replace_once(
              'apps/docs/src/web/desktop-api.ts',
              """      const savedFile = result.file ?? file\n      const oldPath = current?.path\n""",
              """      if (!result.file) {\n        const error = 'Host reported a successful save without the latest file descriptor.'\n        reportHostSaveResult(false, error)\n        return { ok: false, error }\n      }\n\n      const savedFile = result.file\n      const oldPath = current?.path\n""",
          )
          replace_once(
              'apps/docs/src/web/desktop-api.ts',
              """    saveDocx: async (_path, data) => saveWithName(current?.file.name ?? 'Untitled.docx', data),\n""",
              """    saveDocx: async (_path, data) =>\n      saveWithName(current?.file.name ?? 'Untitled.docx', data, 'save'),\n""",
          )
          replace_once(
              'apps/docs/src/web/desktop-api.ts',
              """    saveDocxAs: async (defaultName, data) => saveWithName(defaultName, data),\n    saveDocxNew: async (defaultName, data) => saveWithName(defaultName, data),\n""",
              """    saveDocxAs: async (defaultName, data) => saveWithName(defaultName, data, 'saveAs'),\n    saveDocxNew: async (defaultName, data) => saveWithName(defaultName, data, 'save'),\n""",
          )

          # The SaveMode shim is no longer necessary once the Docs adapter sends mode directly.
          policy = Path('apps/docs/src/web/host-policy.ts')
          text = policy.read_text()
          text = text.replace('  type OfficeHostApi,\n', '')
          marker = "\n/**\n * Existing renderer code already distinguishes saveDocx() and saveDocxAs()."
          if marker not in text:
              raise SystemExit('Docs save-mode adapter marker not found')
          policy.write_text(text.split(marker, 1)[0].rstrip() + '\n')

          replace_once(
              'apps/docs/src/web/bootstrap.ts',
              """import { installWebHostPolicy, installWebSaveModeAdapter } from './host-policy'\n""",
              """import { installWebHostPolicy } from './host-policy'\n""",
          )
          replace_once(
              'apps/docs/src/web/bootstrap.ts',
              """  const controller = createDocsWebDesktopController(host, embeddedRuntime?.bridge)\n  const uninstallSaveMode = installWebSaveModeAdapter(controller, host)\n""",
              """  const controller = createDocsWebDesktopController(host, embeddedRuntime?.bridge)\n""",
          )
          replace_once(
              'apps/docs/src/web/bootstrap.ts',
              """  const cleanup = () => {\n    uninstallSaveMode()\n    hostPolicy.destroy()\n""",
              """  const cleanup = () => {\n    hostPolicy.destroy()\n""",
          )

          replace_once(
              'apps/docs/tests/web-desktop-api.test.ts',
              """import { installWebHostPolicy, installWebSaveModeAdapter } from '../src/web/host-policy'\n""",
              """import { installWebHostPolicy } from '../src/web/host-policy'\n""",
          )
          replace_once(
              'apps/docs/tests/web-desktop-api.test.ts',
              """  const controller = createDocsWebDesktopController(host, bridge)\n  const uninstallSaveMode = installWebSaveModeAdapter(controller, host)\n""",
              """  const controller = createDocsWebDesktopController(host, bridge)\n""",
          )
          replace_once(
              'apps/docs/tests/web-desktop-api.test.ts',
              """  const destroy = () => {\n    uninstallSaveMode()\n    policy.destroy()\n""",
              """  const destroy = () => {\n    policy.destroy()\n""",
          )
          replace_once(
              'apps/docs/tests/web-desktop-api.test.ts',
              """  it('maps host version conflicts to the existing external-modified save contract', async () => {\n""",
              """  it('rejects a Host save success that omits the authoritative file descriptor', async () => {\n    const { controller, emit, initialFile, host, destroy } = createHarness(async () => ({ ok: true }))\n    const pendingOpen = controller.desktopApi.consumePendingOpenDocx()\n    emit({\n      protocol: OFFICE_PROTOCOL_VERSION,\n      type: 'office:init',\n      requestId: 'init-missing-save-file',\n      payload: { kind: 'docx', mode: 'edit', file: initialFile },\n    })\n    const opened = await pendingOpen\n\n    const result = await controller.desktopApi.saveDocx(opened!.path, bytesOf('edited'))\n    expect(result.ok).toBe(false)\n    expect(result.error).toContain('latest file descriptor')\n    expect(host.setTitle).toHaveBeenCalledTimes(1)\n\n    destroy()\n  })\n\n  it('maps host version conflicts to the existing external-modified save contract', async () => {\n""",
          )

          # Slides must also receive the authoritative descriptor before considering Save successful.
          replace_once(
              'apps/slides/src/web/slides-api.ts',
              """      currentFile = {\n        ...(result.file ?? file),\n        mimeType: result.file?.mimeType || PPTX_MIME,\n        size: bytes.byteLength,\n      }\n""",
              """      if (!result.file) {\n        const error = 'Host reported a successful save without the latest file descriptor.'\n        reportPendingHostSave(false, error)\n        return { ok: false, error }\n      }\n      currentFile = {\n        ...result.file,\n        mimeType: result.file.mimeType || PPTX_MIME,\n        size: bytes.byteLength,\n      }\n""",
          )
          PY

      - name: Format touched files
        run: |
          npx prettier --write \
            apps/docs/src/web/desktop-api.ts \
            apps/docs/src/web/host-policy.ts \
            apps/docs/src/web/bootstrap.ts \
            apps/docs/tests/web-desktop-api.test.ts \
            apps/slides/src/web/slides-api.ts

      - name: Targeted validation
        run: |
          npm run typecheck -w @genoffice/docs
          npm run typecheck -w @genoffice/slides
          npm test -w @genoffice/docs -- web-desktop-api.test.ts
          npx eslint \
            apps/docs/src/web/desktop-api.ts \
            apps/docs/src/web/host-policy.ts \
            apps/docs/src/web/bootstrap.ts \
            apps/docs/tests/web-desktop-api.test.ts \
            apps/slides/src/web/slides-api.ts

      - name: Commit and publish integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/docs/src/web/desktop-api.ts \
            apps/docs/src/web/host-policy.ts \
            apps/docs/src/web/bootstrap.ts \
            apps/docs/tests/web-desktop-api.test.ts \
            apps/slides/src/web/slides-api.ts
          git diff --cached --check
          git commit -m "refactor(web): enforce authoritative save identity"
          git push origin HEAD:agent/office-file-protocol-alignment
          git push --force origin HEAD:dev_office_protocol_validation
