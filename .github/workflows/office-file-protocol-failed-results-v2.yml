name: Validate Office picker failure alignment v2

on:
  push:
    branches:
      - agent/office-file-protocol-failed-results

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch carrier
        uses: actions/checkout@v4
        with:
          ref: agent/office-file-protocol-failed-results
          fetch-depth: 0

      - name: Apply corrected patch to integration branch
        shell: bash
        run: |
          cp .github/workflows/office-file-protocol-failed-results.yml /tmp/patch-source.yml
          git checkout -B agent/office-file-protocol-alignment origin/agent/office-file-protocol-alignment
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/patch-source.yml').read_text()
          start = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])

          docs_start = script.index('# 3) Docs:')
          slides_start = script.index('# 4) Slides:', docs_start)
          docs = script[docs_start:slides_start]
          docs = docs.replace('expected=2,', 'expected=1,', 1)
          script = script[:docs_start] + docs + script[slides_start:]
          exec(compile(script, '<office-picker-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Format touched files
        run: |
          npx prettier --write \
            packages/office-host-api/src/index.ts \
            packages/web-runtime/src/index.ts \
            apps/docs/src/web/desktop-api.ts \
            apps/docs/tests/web-desktop-api.test.ts \
            apps/slides/src/web/slides-api.ts \
            apps/sheets/src/web/desktop-api.ts \
            apps/sheets/src/web/local-image.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted protocol tests
        run: |
          npm run test -w @genoffice/docs -- --run tests/web-desktop-api.test.ts tests/web-runtime-protocol.test.ts
          npm run test -w @genoffice/slides -- --run tests/web-slides-api.test.ts
          npm run test -w @genoffice/sheets -- --run tests/web-document-transaction.test.ts

      - name: Repository tests
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/office-host-api/src/index.ts \
            packages/web-runtime/src/index.ts \
            apps/docs/src/web/desktop-api.ts \
            apps/docs/tests/web-desktop-api.test.ts \
            apps/slides/src/web/slides-api.ts \
            apps/sheets/src/web/desktop-api.ts \
            apps/sheets/src/web/local-image.ts
          git commit -m 'fix(web): distinguish picker failures and preserve file descriptors'
          git push origin HEAD:agent/office-file-protocol-alignment
