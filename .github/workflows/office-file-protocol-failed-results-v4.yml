name: Validate Office picker failure alignment v4

on:
  push:
    branches:
      - agent/office-file-protocol-failed-results

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch carrier
        uses: actions/checkout@v4
        with:
          ref: agent/office-file-protocol-failed-results
          fetch-depth: 0

      - name: Apply v3 patch plus Sheets fixture fixes
        shell: bash
        run: |
          cp .github/workflows/office-file-protocol-failed-results.yml /tmp/patch-source.yml
          cp .github/workflows/office-file-protocol-failed-results-v3.yml /tmp/v3.yml
          git checkout -B agent/office-file-protocol-alignment origin/agent/office-file-protocol-alignment
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/v3.yml').read_text()
          start = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<office-picker-v3-patch>', 'exec'), {'__name__': '__main__'})

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          path = 'apps/sheets/tests/web-document-open-transaction.test.ts'
          replace(
              path,
              """        mimeType: XLSX_MIME,\n        version: 4,\n        bytes: buffer(1),\n""",
              """        mimeType: XLSX_MIME,\n        size: 1,\n        version: 4,\n        bytes: buffer(1),\n""",
          )
          replace(
              path,
              """        mimeType: XLSX_MIME,\n        version: 1,\n        bytes: buffer(2),\n""",
              """        mimeType: XLSX_MIME,\n        size: 1,\n        version: 1,\n        bytes: buffer(2),\n""",
          )
          replace(
              path,
              """        mimeType: XLSX_MIME,\n        version: 2,\n        bytes: buffer(3),\n""",
              """        mimeType: XLSX_MIME,\n        size: 1,\n        version: 2,\n        bytes: buffer(3),\n""",
          )
          replace(
              path,
              """        mimeType: XLSX_MIME,\n        version: 2,\n        bytes: buffer(4),\n""",
              """        mimeType: XLSX_MIME,\n        size: 1,\n        version: 2,\n        bytes: buffer(4),\n""",
          )
          replace(
              path,
              """        mimeType: XLSX_MIME,\n        version: 3,\n      },\n""",
              """        mimeType: XLSX_MIME,\n        size: 1,\n        version: 3,\n        transport: 'buffer',\n      },\n""",
          )
          PY

      - name: Format touched files
        run: npx prettier --write packages/office-host-api/src/index.ts packages/web-runtime/src/index.ts apps/docs/src/web/desktop-api.ts apps/docs/tests/web-desktop-api.test.ts apps/docs/tests/web-host-lifecycle.test.ts apps/docs/tests/web-runtime-protocol.test.ts apps/slides/src/web/slides-api.ts apps/sheets/src/web/desktop-api.ts apps/sheets/src/web/local-image.ts apps/sheets/tests/web-document-open-transaction.test.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted protocol tests
        run: |
          npm run test -w @genoffice/docs -- --run tests/web-desktop-api.test.ts tests/web-host-lifecycle.test.ts tests/web-runtime-protocol.test.ts
          npm run test -w @genoffice/slides -- --run tests/web-slides-api.test.ts
          npm run test -w @genoffice/sheets -- --run tests/web-document-open-transaction.test.ts

      - name: Repository tests
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/office-host-api/src/index.ts packages/web-runtime/src/index.ts apps/docs/src/web/desktop-api.ts apps/docs/tests/web-desktop-api.test.ts apps/docs/tests/web-host-lifecycle.test.ts apps/docs/tests/web-runtime-protocol.test.ts apps/slides/src/web/slides-api.ts apps/sheets/src/web/desktop-api.ts apps/sheets/src/web/local-image.ts apps/sheets/tests/web-document-open-transaction.test.ts
          git commit -m 'fix(web): distinguish picker failures and preserve file descriptors'
          git push origin HEAD:agent/office-file-protocol-alignment
