name: Patch Web Office Foundation

on:
  push:
    branches: [agent/web-office-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/web-office-foundation
          fetch-depth: 0

      - name: Apply reviewed foundation fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          protocol = 'packages/office-protocol/src/index.ts'
          replace_once(
              protocol,
              "  | {\n      protocol: typeof OFFICE_PROTOCOL_VERSION\n      type: 'office:save-document'\n      requestId: string\n",
              "  | {\n      protocol: typeof OFFICE_PROTOCOL_VERSION\n      type: 'office:save-result'\n      requestId: string\n      payload: { ok: boolean; error?: string }\n    }\n  | {\n      protocol: typeof OFFICE_PROTOCOL_VERSION\n      type: 'office:save-document'\n      requestId: string\n",
          )

          ipc = 'apps/docs/src/shared/ipc.ts'
          replace_once(
              ipc,
              "  ): () => void\n  openDocx(): Promise<OpenFileResult | null>\n",
              "  ): () => void\n  /** optional parent-controlled mode used by iframe/web runtimes */\n  getHostEditorMode?(): Promise<'view' | 'edit'>\n  onHostEditorModeChanged?(handler: (mode: 'view' | 'edit') => void): () => void\n  /** optional live dirty-state reporting used by iframe/web runtimes */\n  reportDirtyChange?(dirty: boolean): void\n  openDocx(): Promise<OpenFileResult | null>\n",
          )

          desktop = 'apps/docs/src/web/desktop-api.ts'
          replace_once(
              desktop,
              "  const languageHandlers = new Set<LanguageHandler>()\n  const teardownHandlers = new Set<VoidHandler>()\n",
              "  const languageHandlers = new Set<LanguageHandler>()\n  const modeHandlers = new Set<(nextMode: 'view' | 'edit') => void>()\n  const teardownHandlers = new Set<VoidHandler>()\n",
          )
          replace_once(
              desktop,
              "  const aiStreamHandlers = new Set<(chunk: AiStreamChunk) => void>()\n\n  const contextToOpenResult",
              "  const aiStreamHandlers = new Set<(chunk: AiStreamChunk) => void>()\n  const pendingSaveRequestIds = new Set<string>()\n\n  const setMode = (nextMode: 'view' | 'edit'): void => {\n    if (mode === nextMode) return\n    mode = nextMode\n    for (const handler of modeHandlers) handler(mode)\n  }\n\n  const reportHostSaveResult = (ok: boolean, error?: string): void => {\n    if (!bridge || pendingSaveRequestIds.size === 0) return\n    for (const requestId of pendingSaveRequestIds) {\n      bridge.send({\n        protocol: OFFICE_PROTOCOL_VERSION,\n        type: 'office:save-result',\n        requestId,\n        payload: { ok, error },\n      })\n    }\n    pendingSaveRequestIds.clear()\n  }\n\n  const contextToOpenResult",
          )
          replace_once(
              desktop,
              "      if (!result.ok) {\n        return {\n",
              "      if (!result.ok) {\n        reportHostSaveResult(false, result.error)\n        return {\n",
          )
          replace_once(
              desktop,
              "      return { ok: true, path: current.path }\n    } catch (error) {\n      return { ok: false, error: String(error) }\n",
              "      reportHostSaveResult(true)\n      return { ok: true, path: current.path }\n    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error)\n      reportHostSaveResult(false, message)\n      return { ok: false, error: message }\n",
          )
          replace_once(
              desktop,
              "    onLanguageChanged: (handler) => {\n      languageHandlers.add(handler)\n      return () => languageHandlers.delete(handler)\n    },\n    openDocx: openSelectedDocx,\n",
              "    onLanguageChanged: (handler) => {\n      languageHandlers.add(handler)\n      return () => languageHandlers.delete(handler)\n    },\n    getHostEditorMode: async () => mode,\n    onHostEditorModeChanged: (handler) => {\n      modeHandlers.add(handler)\n      return () => modeHandlers.delete(handler)\n    },\n    reportDirtyChange: (dirty) => host.setDirty(dirty),\n    openDocx: openSelectedDocx,\n",
          )
          replace_all(
              desktop,
              "        mode = message.payload.mode\n",
              "        setMode(message.payload.mode)\n",
              2,
          )
          replace_once(
              desktop,
              "      case 'office:save':\n        for (const handler of menuHandlers) handler('save' satisfies MenuCommand)\n        break\n",
              "      case 'office:save': {\n        const shouldTriggerSave = pendingSaveRequestIds.size === 0\n        pendingSaveRequestIds.add(message.requestId)\n        if (!shouldTriggerSave) break\n        if (menuHandlers.size === 0) {\n          reportHostSaveResult(false, 'Editor save handler is not ready.')\n          break\n        }\n        for (const handler of menuHandlers) handler('save' satisfies MenuCommand)\n        break\n      }\n",
          )
          replace_once(
              desktop,
              "      case 'office:set-mode':\n        setMode(message.payload.mode)\n        window.dispatchEvent(new CustomEvent('genoffice:web-mode-change', { detail: { mode } }))\n        break\n",
              "      case 'office:set-mode':\n        setMode(message.payload.mode)\n        break\n",
          )
          replace_once(
              desktop,
              "      languageHandlers.clear()\n      teardownHandlers.clear()\n",
              "      languageHandlers.clear()\n      modeHandlers.clear()\n      pendingSaveRequestIds.clear()\n      teardownHandlers.clear()\n",
          )

          app = 'apps/docs/src/renderer/App.tsx'
          replace_once(
              app,
              "  const [readMode, setReadMode] = useState(false)\n  const [showGrid, setShowGrid] = useState(false)\n",
              "  const [readMode, setReadMode] = useState(false)\n  const [hostEditorMode, setHostEditorMode] = useState<'view' | 'edit'>('edit')\n  const [showGrid, setShowGrid] = useState(false)\n",
          )
          replace_once(
              app,
              "  useEffect(() => {\n    localStorage.setItem('aidocs.autoSave', autoSave ? '1' : '0')\n  }, [autoSave])\n\n  // Pinch-to-zoom",
              "  useEffect(() => {\n    localStorage.setItem('aidocs.autoSave', autoSave ? '1' : '0')\n  }, [autoSave])\n\n  // Web/iframe hosts can force a true view-only mode without changing desktop behavior.\n  useEffect(() => {\n    let active = true\n    const initialMode = window.desktop.getHostEditorMode?.()\n    if (initialMode) {\n      void initialMode.then((nextMode) => {\n        if (active) setHostEditorMode(nextMode)\n      })\n    }\n    const offMode = window.desktop.onHostEditorModeChanged?.((nextMode) => {\n      setHostEditorMode(nextMode)\n    })\n    return () => {\n      active = false\n      offMode?.()\n    }\n  }, [])\n\n  // Pinch-to-zoom",
          )
          replace_once(
              app,
              "  // Read Mode / Restrict Editing: the document becomes read-only; Esc leaves Read Mode\n  useEffect(() => {\n    if (!editor) return\n    editor.setEditable(!readMode && !isProtected)\n",
              "  // Read Mode / Restrict Editing / parent view mode: the document becomes read-only.\n  useEffect(() => {\n    if (!editor) return\n    editor.setEditable(hostEditorMode === 'edit' && !readMode && !isProtected)\n",
          )
          replace_once(
              app,
              "  }, [editor, readMode, isProtected])\n\n  // Track Changes",
              "  }, [editor, readMode, isProtected, hostEditorMode])\n\n  // Track Changes",
          )
          replace_once(
              app,
              "  const anyDirtyRef = useRef(false)\n  const hasUnsavedChanges = isDocDirty(fileCtxRef.current)\n  anyDirtyRef.current = hasUnsavedChanges\n\n  // close guard",
              "  const anyDirtyRef = useRef(false)\n  const hasUnsavedChanges = isDocDirty(fileCtxRef.current)\n  anyDirtyRef.current = hasUnsavedChanges\n  const hostDirty = !!doc && (hasUnsavedChanges || dirtyRef.current)\n  useEffect(() => {\n    window.desktop.reportDirtyChange?.(hostDirty)\n  }, [hostDirty])\n\n  // close guard",
          )
          replace_once(
              app,
              "      <Ribbon\n        quickActions={quickActions}\n",
              "      {hostEditorMode === 'edit' && (\n        <Ribbon\n          quickActions={quickActions}\n",
          )
          replace_once(
              app,
              "        {...ribbonActions}\n      />\n\n      <div className=\"app-main\">\n        {doc && (\n",
              "          {...ribbonActions}\n        />\n      )}\n\n      <div className=\"app-main\">\n        {doc && hostEditorMode === 'edit' && (\n",
          )
          replace_once(
              app,
              "                    onContextMenu={onDocContextMenu}\n",
              "                    onContextMenu={hostEditorMode === 'edit' ? onDocContextMenu : undefined}\n",
          )
          PY

      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/office-protocol/src/index.ts apps/docs/src/shared/ipc.ts apps/docs/src/web/desktop-api.ts apps/docs/src/renderer/App.tsx
          git commit -m "fix(web): complete save state and view-mode bridge"
          git push origin HEAD:agent/web-office-foundation
