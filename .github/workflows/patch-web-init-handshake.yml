name: Patch Web Init Handshake

on:
  push:
    branches: [agent/web-office-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/web-office-foundation
          fetch-depth: 0

      - name: Apply embedded init handshake fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          desktop = 'apps/docs/src/web/desktop-api.ts'
          replace_once(
              desktop,
              "  let current: WebDocumentContext | null = null\n  let pendingOpen: OpenFileResult | null = null\n  let pendingStateRequestId: string | null = null\n",
              "  let current: WebDocumentContext | null = null\n  let pendingOpen: OpenFileResult | null = null\n  let initialOpenResolve: ((result: OpenFileResult | null) => void) | null = null\n  let readyNotified = false\n  let pendingStateRequestId: string | null = null\n",
          )
          replace_once(
              desktop,
              "  const reportHostSaveResult = (ok: boolean, error?: string): void => {\n",
              "  const notifyReady = (): void => {\n    if (readyNotified) return\n    readyNotified = true\n    bridge?.send({\n      protocol: OFFICE_PROTOCOL_VERSION,\n      type: 'office:ready',\n      payload: { kind: 'docx' },\n    })\n  }\n\n  const reportHostSaveResult = (ok: boolean, error?: string): void => {\n",
          )
          replace_once(
              desktop,
              "    consumePendingOpenDocx: async () => {\n      const value = pendingOpen\n      pendingOpen = null\n      return value\n    },\n",
              "    consumePendingOpenDocx: async () => {\n      const value = pendingOpen\n      if (value) {\n        pendingOpen = null\n        return value\n      }\n      if (!bridge) return null\n\n      // The App registers onOpenDocx before calling this method. Announce readiness\n      // only now, then keep the initial boot open pending until the host replies\n      // with office:init. This prevents a blank document from racing the real file.\n      notifyReady()\n      return new Promise<OpenFileResult | null>((resolve) => {\n        initialOpenResolve = resolve\n      })\n    },\n",
          )
          replace_once(
              desktop,
              "        void setCurrentFile(message.payload.file).then((result) => {\n          if (openHandlers.size > 0) {\n            for (const handler of openHandlers) handler(result)\n          } else {\n            pendingOpen = result\n          }\n        })\n",
              "        void setCurrentFile(message.payload.file).then((result) => {\n          if (initialOpenResolve) {\n            const resolve = initialOpenResolve\n            initialOpenResolve = null\n            resolve(result)\n          } else if (openHandlers.size > 0) {\n            for (const handler of openHandlers) handler(result)\n          } else {\n            pendingOpen = result\n          }\n        })\n",
          )
          replace_once(
              desktop,
              "    notifyReady: () => {\n      bridge?.send({\n        protocol: OFFICE_PROTOCOL_VERSION,\n        type: 'office:ready',\n        payload: { kind: 'docx' },\n      })\n    },\n",
              "    notifyReady,\n",
          )
          replace_once(
              desktop,
              "      pendingSaveRequestIds.clear()\n      teardownHandlers.clear()\n",
              "      pendingSaveRequestIds.clear()\n      initialOpenResolve?.(null)\n      initialOpenResolve = null\n      teardownHandlers.clear()\n",
          )

          bootstrap = 'apps/docs/src/web/bootstrap.ts'
          replace_once(
              bootstrap,
              "  await import('../renderer/main')\n  controller.notifyReady()\n",
              "  await import('../renderer/main')\n",
          )
          PY

          npx prettier --write apps/docs/src/web/desktop-api.ts apps/docs/src/web/bootstrap.ts

      - name: Commit handshake fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/web/desktop-api.ts apps/docs/src/web/bootstrap.ts
          git commit -m "fix(web): serialize embedded initial document handshake"
          git push origin HEAD:agent/web-office-foundation
