name: Temporary Word Web Productization

on:
  push:
    branches: [agent/web-office-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/web-office-foundation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply productization patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new))

          # DesktopApi exposes web-only host capability policy without requiring Electron to implement it.
          replace(
              'apps/docs/src/shared/ipc.ts',
              "export interface OpenFileResult {",
              "import type { OfficeHostCapabilities } from '@genoffice/office-host-api'\n\nexport interface OpenFileResult {",
          )
          replace(
              'apps/docs/src/shared/ipc.ts',
              "  getHostEditorMode?(): Promise<'view' | 'edit'>\n  onHostEditorModeChanged?(handler: (mode: 'view' | 'edit') => void): () => void\n  /** optional live dirty-state reporting used by iframe/web runtimes */",
              "  getHostEditorMode?(): Promise<'view' | 'edit'>\n  onHostEditorModeChanged?(handler: (mode: 'view' | 'edit') => void): () => void\n  /** optional host UI/behavior policy used by browser runtimes */\n  getHostCapabilities?(): Promise<OfficeHostCapabilities>\n  onHostCapabilitiesChanged?(handler: (capabilities: OfficeHostCapabilities) => void): () => void\n  /** optional live dirty-state reporting used by iframe/web runtimes */",
          )

          # Web desktop adapter owns browser UI policy and carries save/saveAs intent to the Host.
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "import type {\n  OfficeFile,\n  OfficeFileDescriptor,\n  OfficeHostApi,\n  SelectedOfficeFile,\n} from '@genoffice/office-host-api'",
              "import {\n  DEFAULT_EMBEDDED_OFFICE_CAPABILITIES,\n  DEFAULT_STANDALONE_OFFICE_CAPABILITIES,\n  type OfficeFile,\n  type OfficeFileDescriptor,\n  type OfficeHostApi,\n  type OfficeHostCapabilities,\n  type OfficeSaveMode,\n  type SelectedOfficeFile,\n} from '@genoffice/office-host-api'",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "type VoidHandler = () => void\n",
              "type VoidHandler = () => void\ntype CapabilityHandler = (capabilities: OfficeHostCapabilities) => void\n",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "  let aiSettings = emptyAiSettings()\n\n  const openHandlers = new Set<OpenHandler>()",
              "  let aiSettings = emptyAiSettings()\n  let capabilities: OfficeHostCapabilities = {\n    ...(bridge\n      ? DEFAULT_EMBEDDED_OFFICE_CAPABILITIES\n      : DEFAULT_STANDALONE_OFFICE_CAPABILITIES),\n  }\n\n  const openHandlers = new Set<OpenHandler>()",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "  const aiStreamHandlers = new Set<(chunk: AiStreamChunk) => void>()\n  const pendingSaveRequestIds = new Set<string>()\n\n  const setMode =",
              "  const aiStreamHandlers = new Set<(chunk: AiStreamChunk) => void>()\n  const capabilityHandlers = new Set<CapabilityHandler>()\n  const pendingSaveRequestIds = new Set<string>()\n\n  const applyCapabilityClasses = (): void => {\n    const root = document.documentElement\n    root.classList.add('office-web')\n    root.classList.toggle('office-ai-enabled', capabilities.ai)\n    root.classList.toggle('office-autosave-editor', capabilities.autoSave === 'editor')\n    root.classList.toggle('office-page-crop-marks', capabilities.pageCropMarks)\n    root.classList.toggle('office-can-open', capabilities.open)\n    root.classList.toggle('office-can-save', capabilities.save)\n    root.classList.toggle('office-can-save-as', capabilities.saveAs)\n  }\n\n  const setCapabilities = (patch: Partial<OfficeHostCapabilities>): void => {\n    capabilities = { ...capabilities, ...patch }\n    applyCapabilityClasses()\n    for (const handler of capabilityHandlers) handler({ ...capabilities })\n  }\n\n  applyCapabilityClasses()\n\n  const setMode =",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "  const saveWithName = async (\n    name: string,\n    data: ArrayBuffer,\n  ): Promise<{ ok: boolean; path?: string; error?: string; reason?: 'external-modified' }> => {",
              "  const saveWithName = async (\n    name: string,\n    data: ArrayBuffer,\n    saveMode: OfficeSaveMode = 'save',\n  ): Promise<{ ok: boolean; path?: string; error?: string; reason?: 'external-modified' }> => {",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "        bytes: data,\n        baseVersion: current?.file.version ?? null,\n      })",
              "        bytes: data,\n        baseVersion: current?.file.version ?? null,\n        mode: saveMode,\n      })",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "    getHostEditorMode: async () => mode,\n    onHostEditorModeChanged: (handler) => {\n      modeHandlers.add(handler)\n      return () => modeHandlers.delete(handler)\n    },\n    reportDirtyChange:",
              "    getHostEditorMode: async () => mode,\n    onHostEditorModeChanged: (handler) => {\n      modeHandlers.add(handler)\n      return () => modeHandlers.delete(handler)\n    },\n    getHostCapabilities: async () => ({ ...capabilities }),\n    onHostCapabilitiesChanged: (handler) => {\n      capabilityHandlers.add(handler)\n      return () => capabilityHandlers.delete(handler)\n    },\n    reportDirtyChange:",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "    saveDocxAs: async (defaultName, data) => saveWithName(defaultName, data),",
              "    saveDocxAs: async (defaultName, data) => saveWithName(defaultName, data, 'saveAs'),",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "      case 'office:init': {\n        if (message.payload.kind !== 'docx') return\n        setMode(message.payload.mode)",
              "      case 'office:init': {\n        if (message.payload.kind !== 'docx') return\n        if (message.payload.capabilities) setCapabilities(message.payload.capabilities)\n        setMode(message.payload.mode)",
          )
          replace(
              'apps/docs/src/web/desktop-api.ts',
              "      aiStreamHandlers.clear()\n    },",
              "      aiStreamHandlers.clear()\n      capabilityHandlers.clear()\n      document.documentElement.classList.remove(\n        'office-web',\n        'office-ai-enabled',\n        'office-autosave-editor',\n        'office-page-crop-marks',\n        'office-can-open',\n        'office-can-save',\n        'office-can-save-as',\n      )\n    },",
          )

          # Page-gap widgets expose per-page body margins so visual corner marks can follow pagination.
          replace(
              'apps/docs/src/renderer/editor/pagination-gaps.ts',
              "  gap.style.setProperty('--gap-mb', `${m.marginBottom}px`)\n  gap.style.setProperty('--gap-mt', `${m.marginTop}px`)",
              "  gap.style.setProperty('--gap-mb', `${m.marginBottom}px`)\n  gap.style.setProperty('--gap-mt', `${m.marginTop}px`)\n  gap.style.setProperty('--gap-ml', `${m.marginLeft}px`)\n  gap.style.setProperty('--gap-mr', `${m.marginRight}px`)",
          )

          # Host demo declares production-like capabilities and turns Save As into a new host file identity.
          replace(
              'examples/web-host/src/main.ts',
              "      locale: 'zh-CN',\n      file: { ...currentFile, bytes: currentFile.bytes.slice(0) },",
              "      locale: 'zh-CN',\n      capabilities: {\n        ai: false,\n        open: true,\n        save: true,\n        saveAs: true,\n        autoSave: 'host',\n        download: false,\n        print: true,\n        systemFilePicker: true,\n        pageCropMarks: true,\n      },\n      file: { ...currentFile, bytes: currentFile.bytes.slice(0) },",
          )
          replace(
              'examples/web-host/src/main.ts',
              "    case 'office:save-document': {\n      const bytes = message.payload.bytes.slice(0)\n      versionCounter += 1\n      const saved: OfficeFile = {\n        ...message.payload.file,\n        size: bytes.byteLength,\n        version: `v${versionCounter}`,\n        bytes,\n      }",
              "    case 'office:save-document': {\n      const bytes = message.payload.bytes.slice(0)\n      const saveAs = message.payload.mode === 'saveAs'\n      let targetName = message.payload.file.name\n      if (saveAs) {\n        const requested = window.prompt('另存为文件名', targetName)\n        if (requested === null || !requested.trim()) {\n          send({\n            protocol: OFFICE_PROTOCOL_VERSION,\n            type: 'office:save-document-result',\n            requestId: message.requestId,\n            payload: { ok: false, code: 'CANCELLED', error: '已取消另存为。' },\n          })\n          setHostState('ready')\n          break\n        }\n        targetName = requested.trim()\n        versionCounter = 1\n      } else {\n        versionCounter += 1\n      }\n      const saved: OfficeFile = {\n        ...message.payload.file,\n        id: saveAs ? `doc:${crypto.randomUUID()}` : message.payload.file.id,\n        name: targetName,\n        size: bytes.byteLength,\n        version: `v${versionCounter}`,\n        bytes,\n      }",
          )

          # Web-only presentation policy. Desktop/Electron styles are unchanged because all selectors are root capability classes.
          styles = Path('apps/docs/src/renderer/styles.css')
          css = styles.read_text()
          marker = '/* ================= Web Office host capability policy ================= */'
          if marker not in css:
              css += r'''

/* ================= Web Office host capability policy ================= */

html.office-web:not(.office-ai-enabled) .ribbon-group:has(.ai-entry),
html.office-web:not(.office-ai-enabled) .ribbon-group:has(.ai-entry) + .ribbon-sep,
html.office-web:not(.office-ai-enabled) .ai-dock,
html.office-web:not(.office-ai-enabled) .ctx-item:has(.copilot-badge),
html.office-web:not(.office-ai-enabled) .ctx-item-wrap:has(> .ctx-item .copilot-badge),
html.office-web:not(.office-ai-enabled) .ctx-menu > .ctx-sep:has(+ .ctx-item .copilot-badge) {
  display: none;
}

html.office-web:not(.office-autosave-editor) .autosave-toggle {
  display: none;
}

html.office-web:not(.office-can-open) .file-menu > button:nth-child(1),
html.office-web:not(.office-can-save) .file-menu > button:nth-child(2),
html.office-web:not(.office-can-save-as) .file-menu > button:nth-child(3) {
  display: none;
}

/* Editing-area corner marks are a visual overlay only. They use the document's
   content box, so the first/last page follows the live section margins without
   adding nodes to ProseMirror or OOXML. */
html.office-page-crop-marks .doc-page {
  background-color: var(--page-bg, var(--surface));
  background-image:
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b);
  background-repeat: no-repeat;
  background-origin: content-box;
  background-size:
    12px 1px,
    1px 12px,
    12px 1px,
    1px 12px,
    12px 1px,
    1px 12px,
    12px 1px,
    1px 12px;
  background-position:
    left top,
    left top,
    right top,
    right top,
    left bottom,
    left bottom,
    right bottom,
    right bottom;
}

/* Every pagination gap is exactly: previous bottom margin + gray band + next
   top margin. Its top/bottom edges are therefore the adjacent pages' body
   boundaries, so these decorations supply the intermediate page corner marks. */
html.office-page-crop-marks .page-gap:not(.page-gap-table)::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background-image:
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b),
    linear-gradient(#8b8b8b, #8b8b8b);
  background-repeat: no-repeat;
  background-size:
    12px 1px,
    1px 12px,
    12px 1px,
    1px 12px,
    12px 1px,
    1px 12px,
    12px 1px,
    1px 12px;
  background-position:
    var(--gap-ml, 96px) top,
    var(--gap-ml, 96px) top,
    calc(100% - var(--gap-mr, 96px) - 12px) top,
    calc(100% - var(--gap-mr, 96px) - 1px) top,
    var(--gap-ml, 96px) calc(100% - 1px),
    var(--gap-ml, 96px) calc(100% - 12px),
    calc(100% - var(--gap-mr, 96px) - 12px) calc(100% - 1px),
    calc(100% - var(--gap-mr, 96px) - 1px) calc(100% - 12px);
}
'''
              styles.write_text(css)

      - name: Format patched files
        run: npx prettier --write packages/office-host-api/src/index.ts packages/office-protocol/src/index.ts packages/web-runtime/src/index.ts apps/docs/src/shared/ipc.ts apps/docs/src/web/bootstrap.ts apps/docs/src/web/desktop-api.ts apps/docs/src/renderer/editor/pagination-gaps.ts apps/docs/src/renderer/styles.css examples/web-host/src/main.ts
      - name: Validate focused workspaces
        run: |
          npm run typecheck -w @genoffice/office-host-api
          npm run typecheck -w @genoffice/office-protocol
          npm run typecheck -w @genoffice/web-runtime
          npm run typecheck -w @genoffice/docs
          npm run test -w @genoffice/docs
          npm run build:web:docs
          npm run build:web-host
      - name: Commit productization patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/office-host-api/src/index.ts packages/office-protocol/src/index.ts packages/web-runtime/src/index.ts apps/docs/src/shared/ipc.ts apps/docs/src/web/bootstrap.ts apps/docs/src/web/desktop-api.ts apps/docs/src/renderer/editor/pagination-gaps.ts apps/docs/src/renderer/styles.css examples/web-host/src/main.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(web): productize Word host UI and file semantics"
          git push origin HEAD:agent/web-office-foundation
