name: Docs Web E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ppt-web-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ppt-web-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ppt-web-foundation
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Apply PPT Web patch
        run: |
          python .github/scripts/patch-ppt-web.py
          python .github/scripts/patch-ppt-web-fixup.py
      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Format changed sources
        run: |
          npx prettier --write \
            package.json package-lock.json \
            apps/slides/src/shared/ipc.ts \
            apps/slides/src/renderer/App.tsx \
            apps/slides/src/renderer/components/Ribbon.tsx \
            apps/slides/src/renderer/components/ribbon-shared.tsx \
            apps/slides/src/renderer/web-labels.ts \
            apps/slides/src/web \
            apps/slides/vite.web.config.ts \
            packages/office-host-api/src/index.ts \
            packages/pptx-engine/src
      - name: Show byte migration diagnostics
        run: python .github/scripts/debug-ppt-web.py
      - name: Slides typecheck
        run: npm run typecheck -w @genoffice/slides
      - name: PPTX engine typecheck
        run: npm run typecheck -w @genoffice/pptx-engine
      - name: Slides Web build
        run: npm run build:web -w @genoffice/slides
      - name: Commit product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json apps/slides packages/office-host-api packages/pptx-engine
          git commit -m "feat(slides-web): complete browser host lifecycle" || exit 0
          git push origin HEAD:agent/ppt-web-foundation

  docs-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate DOCX fixtures
        run: npm run fixtures

      - name: Build Docs Web
        run: npm run build:web:docs

      - name: Build iframe Host Demo
        run: npm run build:web-host

      - name: Start Docs Web
        run: |
          npx vite preview --config vite.web.config.ts --host 127.0.0.1 --port 5273 > /tmp/docs-web.log 2>&1 &
          echo $! > /tmp/docs-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5273/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/docs-web.log
          exit 1
        working-directory: apps/docs

      - name: Start iframe Host Demo
        run: |
          npx vite preview --config examples/web-host/vite.config.ts --host 127.0.0.1 --port 8080 > /tmp/web-host.log 2>&1 &
          echo $! > /tmp/web-host.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web-host.log
          exit 1

      - name: Browser E2E (Docs Web)
        env:
          DOCS_WEB_E2E_URL: http://127.0.0.1:5273/
          DOCS_WEB_HOST_E2E_URL: http://127.0.0.1:8080/
        run: npx playwright test e2e/docs-web.spec.ts --config e2e/playwright.config.ts

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/docs-web.log
            /tmp/web-host.log
          retention-days: 7
