name: Docs Web E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/web-office-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/web-office-foundation

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Word Web host protocol patch
        run: python .github/scripts/patch-word-web-host-protocol.py

      - name: Format changed files
        run: |
          npx prettier --write \
            packages/office-host-api/src/index.ts \
            packages/office-protocol/src/index.ts \
            packages/web-runtime/src/index.ts \
            apps/docs/src/shared/ipc.ts \
            apps/docs/src/web/desktop-api.ts \
            apps/docs/src/web/host-policy.ts \
            apps/docs/src/web/product-policy.css \
            apps/docs/src/renderer/components/Ribbon.tsx \
            apps/docs/src/renderer/components/ExitConfirmModal.tsx \
            apps/docs/src/renderer/i18n/strings-ribbon.ts \
            apps/docs/src/renderer/App.tsx \
            apps/docs/tests/web-desktop-api.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Focused Docs Web tests
        run: npm run test -w @genoffice/docs -- web-desktop-api.test.ts

      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/office-host-api packages/office-protocol packages/web-runtime apps/docs/src apps/docs/tests/web-desktop-api.test.ts
          git commit -m "feat(docs-web): extend host file lifecycle protocol"
          git push origin HEAD:agent/web-office-foundation

  docs-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate DOCX fixtures
        run: npm run fixtures

      - name: Build Docs Web
        run: npm run build:web:docs

      - name: Build iframe Host Demo
        run: npm run build:web-host

      - name: Start Docs Web
        run: |
          npx vite preview --config vite.web.config.ts --host 127.0.0.1 --port 5273 > /tmp/docs-web.log 2>&1 &
          echo $! > /tmp/docs-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5273/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/docs-web.log
          exit 1
        working-directory: apps/docs

      - name: Start iframe Host Demo
        run: |
          npx vite preview --config examples/web-host/vite.config.ts --host 127.0.0.1 --port 8080 > /tmp/web-host.log 2>&1 &
          echo $! > /tmp/web-host.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web-host.log
          exit 1

      - name: Browser E2E (Docs Web)
        env:
          DOCS_WEB_E2E_URL: http://127.0.0.1:5273/
          DOCS_WEB_HOST_E2E_URL: http://127.0.0.1:8080/
        run: npx playwright test e2e/docs-web.spec.ts --config e2e/playwright.config.ts

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/docs-web.log
            /tmp/web-host.log
          retention-days: 7
