name: Docs Web E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Docs Web
        run: npm run build:web:docs

      - name: Start Docs Web
        run: |
          npx vite preview --config apps/docs/vite.web.config.ts --host 127.0.0.1 --port 5273 > /tmp/docs-web.log 2>&1 &
          echo $! > /tmp/docs-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5273/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/docs-web.log
          exit 1

      - name: Browser E2E (Docs Web)
        env:
          DOCS_WEB_E2E_URL: http://127.0.0.1:5273/
        run: npx playwright test e2e/docs-web.spec.ts --config e2e/playwright.config.ts --project=chromium

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/docs-web.log
          retention-days: 7
