name: Apply Markdown file actions

on:
  push:
    branches: [feature/markdown-file-actions]
    paths:
      - '.github/workflows/markdown-file-actions-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/markdown-file-actions
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply focused Markdown Web changes
        run: python .github/scripts/apply-markdown-file-actions.py

      - name: Format changed files
        run: npm run format

      - name: Validate focused change
        run: |
          npm run lint
          npm run typecheck
          npm run test -w @genoffice/markdown
          npm run build:web:markdown
          npm run build:web-markdown-host

      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/office-host-api/src/index.ts \
                  apps/markdown/src/shared/ipc.ts \
                  apps/markdown/src/web/markdown-api.ts \
                  apps/markdown/src/renderer/App.tsx \
                  apps/markdown/src/renderer/components/FileMenu.tsx \
                  apps/markdown/src/renderer/components/icons.tsx \
                  apps/markdown/src/web/product-policy.css \
                  examples/web-markdown-host/src/main.ts \
                  e2e/markdown-web.spec.ts
          git commit -m "feat(markdown-web): complete UC file actions"
          git push origin HEAD:feature/markdown-file-actions
