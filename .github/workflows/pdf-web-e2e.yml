name: PDF Web E2E

on:
  pull_request:
    branches: [web/develop]
    paths:
      - 'apps/pdf/**'
      - 'packages/office-host-api/**'
      - 'packages/office-protocol/**'
      - 'packages/iframe-bridge/**'
      - 'packages/web-runtime/**'
      - 'examples/web-pdf-host/**'
      - 'e2e/pdf-web.spec.ts'
      - 'package.json'
      - '.github/workflows/pdf-web-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared protocol and PDF Web
        run: |
          npm run typecheck -w @genoffice/office-host-api
          npm run typecheck -w @genoffice/office-protocol
          npm run typecheck -w @genoffice/iframe-bridge
          npm run typecheck -w @genoffice/web-runtime
          npm run typecheck -w @genoffice/pdf

      - name: PDF unit tests
        run: npm run test -w @genoffice/pdf

      - name: Build PDF Web
        run: npm run build:web:pdf

      - name: Build iframe Host Demo
        run: npm run build:web-pdf-host

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start PDF Web
        run: |
          npx vite preview --config vite.web.config.ts --host 127.0.0.1 --port 5276 > /tmp/pdf-web.log 2>&1 &
          echo $! > /tmp/pdf-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5276/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pdf-web.log
          exit 1
        working-directory: apps/pdf

      - name: Start iframe Host Demo
        run: |
          npx vite preview --config examples/web-pdf-host/vite.config.ts --host 127.0.0.1 --port 8083 > /tmp/pdf-web-host.log 2>&1 &
          echo $! > /tmp/pdf-web-host.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8083/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pdf-web-host.log
          exit 1

      - name: Browser E2E (PDF Web)
        env:
          PDF_WEB_E2E_URL: http://127.0.0.1:5276/
          PDF_WEB_HOST_E2E_URL: http://127.0.0.1:8083/
        run: npx playwright test e2e/pdf-web.spec.ts --config e2e/playwright.config.ts

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/pdf-web.log
            /tmp/pdf-web-host.log
          retention-days: 7
