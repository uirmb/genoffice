name: Debug Prettier Prebound

on:
  pull_request:
    branches: [web/develop]
    paths:
      - 'apps/sheets/tests/web-document-open-transaction.test.ts'
      - '.github/workflows/debug-prettier-prebound.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier apps/sheets/tests/web-document-open-transaction.test.ts --write
          git diff -- apps/sheets/tests/web-document-open-transaction.test.ts
