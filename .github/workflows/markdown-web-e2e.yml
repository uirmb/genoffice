name: Markdown Web E2E

on:
  pull_request:
    branches: [web/develop]
    paths:
      - 'apps/markdown/**'
      - 'packages/office-host-api/**'
      - 'packages/office-protocol/**'
      - 'packages/iframe-bridge/**'
      - 'packages/web-runtime/**'
      - 'examples/web-markdown-host/**'
      - 'e2e/markdown-web.spec.ts'
      - 'package.json'
      - '.github/workflows/markdown-web-e2e.yml'
  workflow_dispatch:

concurrency:
  group: markdown-web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check changed-file formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Full workspace typecheck
        run: npm run typecheck

      - name: Markdown unit tests
        run: npm run test -w @genoffice/markdown

      - name: Build Markdown Web
        run: npm run build:web:markdown

      - name: Build iframe Host Demo
        run: npm run build:web-markdown-host

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Markdown Web
        run: |
          npx vite preview --config vite.web.config.ts --host 127.0.0.1 --port 5277 > /tmp/markdown-web.log 2>&1 &
          echo $! > /tmp/markdown-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5277/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/markdown-web.log
          exit 1
        working-directory: apps/markdown

      - name: Start iframe Host Demo
        run: |
          npx vite preview --config examples/web-markdown-host/vite.config.ts --host 127.0.0.1 --port 18084 > /tmp/markdown-web-host.log 2>&1 &
          echo $! > /tmp/markdown-web-host.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18084/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/markdown-web-host.log
          exit 1

      - name: Browser E2E (Markdown Web)
        env:
          MARKDOWN_WEB_E2E_URL: http://127.0.0.1:5277/
          MARKDOWN_WEB_HOST_E2E_URL: http://127.0.0.1:18084/
        run: npx playwright test e2e/markdown-web.spec.ts --config e2e/playwright.config.ts

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/markdown-web.log
            /tmp/markdown-web-host.log
          if-no-files-found: ignore
          retention-days: 7
