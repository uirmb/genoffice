name: Format notification ownership PR

on:
  push:
    branches:
      - fix/web-office-notification-ownership

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        env:
          FORMAT_BASE_REF: 33aa4c7372a8cbfdc16fe0809a2ccc871887dde1
        run: npm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format notification ownership changes"
          git push origin HEAD:fix/web-office-notification-ownership
