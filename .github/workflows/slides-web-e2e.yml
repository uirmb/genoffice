name: Slides Web E2E

on:
  pull_request:
    branches: [main, agent/web-office-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-window-close:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ppt-web-foundation'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply close protocol patch
        run: |
          if grep -q "type: 'office:request-close'" packages/office-protocol/src/index.ts; then
            echo "Patch already applied"
            exit 0
          fi
          python3 scripts/patch-office-window-close-ppt.py
          npx prettier --write \
            packages/office-protocol/src/index.ts \
            apps/slides/src/shared/ipc.ts \
            apps/slides/src/web/slides-api.ts \
            apps/slides/src/renderer/App.tsx \
            apps/slides/tests/web-slides-api.test.ts
          npm run typecheck
          npm test -w @genoffice/slides

      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo "No product changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/office-protocol/src/index.ts \
            apps/slides/src/shared/ipc.ts \
            apps/slides/src/web/slides-api.ts \
            apps/slides/src/renderer/App.tsx \
            apps/slides/tests/web-slides-api.test.ts
          git commit -m "feat(web): guard host window close through PPT exit flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  slides-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Slides Web
        run: npm run build:web:slides

      - name: Build PPT iframe Host Demo
        run: npm run build:web-ppt-host

      - name: Start Slides Web
        run: |
          npx vite preview --config vite.web.config.ts --host 127.0.0.1 --port 5274 > /tmp/slides-web.log 2>&1 &
          echo $! > /tmp/slides-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5274/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/slides-web.log
          exit 1
        working-directory: apps/slides

      - name: Start PPT iframe Host Demo
        run: |
          npx vite preview --config examples/web-ppt-host/vite.config.ts --host 127.0.0.1 --port 8081 > /tmp/web-ppt-host.log 2>&1 &
          echo $! > /tmp/web-ppt-host.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web-ppt-host.log
          exit 1

      - name: Browser E2E (Slides Web)
        env:
          SLIDES_WEB_E2E_URL: http://127.0.0.1:5274/
          SLIDES_WEB_HOST_E2E_URL: http://127.0.0.1:8081/
        run: npx playwright test e2e/slides-web.spec.ts --config e2e/playwright.config.ts

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/slides-web.log
            /tmp/web-ppt-host.log
          retention-days: 7
