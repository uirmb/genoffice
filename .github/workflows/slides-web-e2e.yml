name: Slides Web E2E

on:
  pull_request:
    branches: [main, agent/web-office-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dirty-exit-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ppt-web-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ppt-web-foundation
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Fix dirty exit source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/slides/src/renderer/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  const requestExit = useCallback(async () => {\n    if (!dirty) {\n      await window.slidesApi.requestHostClose?.()\n      return\n    }\n    setExitConfirmOpen(true)\n  }, [dirty])\n"""
          new = """  const requestExit = useCallback(async () => {\n    const sessionDirty = await window.slidesApi.isDirty()\n    if (!dirty && !sessionDirty) {\n      await window.slidesApi.requestHostClose?.()\n      return\n    }\n    setExitConfirmOpen(true)\n  }, [dirty])\n"""
          if old not in text:
              raise SystemExit('requestExit anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and verify
        run: |
          npx prettier --write apps/slides/src/renderer/App.tsx
          npx eslint apps/slides/src/renderer/App.tsx
          npm run typecheck -w @genoffice/slides
      - name: Commit dirty exit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/slides/src/renderer/App.tsx
          git commit -m "fix(slides-web): guard exit with session dirty state" || exit 0
          git push origin HEAD:agent/ppt-web-foundation

  slides-web-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Slides Web
        run: npm run build:web:slides

      - name: Build PPT iframe Host Demo
        run: npm run build:web-ppt-host

      - name: Start Slides Web
        run: |
          npx vite preview --config vite.web.config.ts --host 127.0.0.1 --port 5274 > /tmp/slides-web.log 2>&1 &
          echo $! > /tmp/slides-web.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5274/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/slides-web.log
          exit 1
        working-directory: apps/slides

      - name: Start PPT iframe Host Demo
        run: |
          npx vite preview --config examples/web-ppt-host/vite.config.ts --host 127.0.0.1 --port 8081 > /tmp/web-ppt-host.log 2>&1 &
          echo $! > /tmp/web-ppt-host.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web-ppt-host.log
          exit 1

      - name: Browser E2E (Slides Web)
        env:
          SLIDES_WEB_E2E_URL: http://127.0.0.1:5274/
          SLIDES_WEB_HOST_E2E_URL: http://127.0.0.1:8081/
        run: npx playwright test e2e/slides-web.spec.ts --config e2e/playwright.config.ts

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slides-web-e2e-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
            /tmp/slides-web.log
            /tmp/web-ppt-host.log
          retention-days: 7
