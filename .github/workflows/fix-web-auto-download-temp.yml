name: Temporary Web Auto Download Fix

on:
  push:
    branches: [agent/web-office-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/web-office-foundation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Web silent-save guard and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          ipc = Path('apps/docs/src/shared/ipc.ts')
          text = ipc.read_text()
          old = "  /** optional live dirty-state reporting used by iframe/web runtimes */\n  reportDirtyChange?(dirty: boolean): void\n  openDocx(): Promise<OpenFileResult | null>"
          new = "  /** optional live dirty-state reporting used by iframe/web runtimes */\n  reportDirtyChange?(dirty: boolean): void\n  /** Web runtimes cannot silently create a local file during recovery/autosave. */\n  canAutoPersistPathlessDocument?(): boolean\n  openDocx(): Promise<OpenFileResult | null>"
          if old not in text:
              raise SystemExit('ipc patch anchor not found')
          ipc.write_text(text.replace(old, new, 1))

          desktop = Path('apps/docs/src/web/desktop-api.ts')
          text = desktop.read_text()
          old = "    reportDirtyChange: (dirty) => host.setDirty(dirty),\n    openDocx: openSelectedDocx,"
          new = "    reportDirtyChange: (dirty) => host.setDirty(dirty),\n    canAutoPersistPathlessDocument: () => false,\n    openDocx: openSelectedDocx,"
          if old not in text:
              raise SystemExit('desktop-api patch anchor not found')
          desktop.write_text(text.replace(old, new, 1))

          actions = Path('apps/docs/src/renderer/file-actions.ts')
          text = actions.read_text()
          old = "async function saveOnce(ctx: FileActionContext, saveAs: boolean, auto: boolean): Promise<boolean> {\n  const { doc, editor } = ctx\n  if (!doc || !editor) return false\n  ctx.saveInFlightRef.current = true"
          new = "async function saveOnce(ctx: FileActionContext, saveAs: boolean, auto: boolean): Promise<boolean> {\n  const { doc, editor } = ctx\n  if (!doc || !editor) return false\n  // Electron can silently land an untitled document in its default folder for\n  // crash recovery. A browser cannot do that without turning an internal\n  // recovery/autosave tick into a visible download. Web runtimes explicitly\n  // opt out; manual Save/Save As (auto=false) remains unchanged.\n  if (auto && !doc.filePath && window.desktop.canAutoPersistPathlessDocument?.() === false) {\n    return false\n  }\n  ctx.saveInFlightRef.current = true"
          if old not in text:
              raise SystemExit('file-actions patch anchor not found')
          actions.write_text(text.replace(old, new, 1))

          e2e = Path('e2e/docs-web.spec.ts')
          text = e2e.read_text()
          old = "  test('boots the productized browser editor and edits a blank document', async ({ page }) => {\n    await page.goto(docsWebUrl!)"
          new = "  test('boots the productized browser editor and edits a blank document', async ({ page }) => {\n    const unexpectedDownloads: string[] = []\n    page.on('download', (download) => unexpectedDownloads.push(download.suggestedFilename()))\n\n    await page.goto(docsWebUrl!)"
          if old not in text:
              raise SystemExit('e2e start patch anchor not found')
          text = text.replace(old, new, 1)
          old = "    await expect(editor).toContainText(text)\n\n    await expect.poll(() => page.title()).toBeTruthy()"
          new = "    await expect(editor).toContainText(text)\n\n    // A pathless Web document must never turn background recovery or the\n    // legacy AI-complete silent-save hook into a browser download.\n    await page.evaluate(() => window.dispatchEvent(new Event('ai-docs-run-done')))\n    await page.waitForTimeout(31_000)\n    expect(unexpectedDownloads).toEqual([])\n\n    await expect.poll(() => page.title()).toBeTruthy()"
          if old not in text:
              raise SystemExit('e2e assertion patch anchor not found')
          e2e.write_text(text.replace(old, new, 1))
          PY
      - run: npx prettier --write apps/docs/src/shared/ipc.ts apps/docs/src/web/desktop-api.ts apps/docs/src/renderer/file-actions.ts e2e/docs-web.spec.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/shared/ipc.ts apps/docs/src/web/desktop-api.ts apps/docs/src/renderer/file-actions.ts e2e/docs-web.spec.ts
          git commit -m "fix(docs-web): prevent background saves from downloading drafts"
          git push origin HEAD:agent/web-office-foundation
