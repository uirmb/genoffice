name: Validate Web Office Foundation

on:
  push:
    branches: [agent/web-office-foundation]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/web-office-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Format reviewed files
        run: >-
          npx prettier --write
          apps/docs/src/renderer/App.tsx
          apps/docs/src/shared/ipc.ts
          apps/docs/src/web/bootstrap.ts
          apps/docs/src/web/desktop-api.ts
          apps/docs/vite.web.config.ts
          packages/office-host-api/src/index.ts
          packages/office-protocol/src/index.ts
          packages/iframe-bridge/src/index.ts
          packages/web-runtime/src/index.ts

      - name: Lint reviewed files
        run: >-
          npx eslint
          apps/docs/src/renderer/App.tsx
          apps/docs/src/shared/ipc.ts
          apps/docs/src/web/bootstrap.ts
          apps/docs/src/web/desktop-api.ts
          apps/docs/vite.web.config.ts
          packages/office-host-api/src/index.ts
          packages/office-protocol/src/index.ts
          packages/iframe-bridge/src/index.ts
          packages/web-runtime/src/index.ts

      - name: Typecheck shared web workspaces
        run: |
          npm run typecheck -w @genoffice/office-host-api
          npm run typecheck -w @genoffice/office-protocol
          npm run typecheck -w @genoffice/iframe-bridge
          npm run typecheck -w @genoffice/web-runtime

      - name: Typecheck Docs
        run: npm run typecheck -w @genoffice/docs

      - name: Build Docs web
        run: npm run build:web:docs

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/renderer/App.tsx apps/docs/src/shared/ipc.ts apps/docs/src/web/bootstrap.ts apps/docs/src/web/desktop-api.ts apps/docs/vite.web.config.ts packages/office-host-api/src/index.ts packages/office-protocol/src/index.ts packages/iframe-bridge/src/index.ts packages/web-runtime/src/index.ts
          git commit -m "style(web): format foundation changes"
          git push origin HEAD:agent/web-office-foundation
